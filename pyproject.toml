# Bot ka Python project. Abhi koi runtime dependency NAHI (sirf standard library).
# Dev tools ke exact version + hash: requirements-dev.lock (uv se bana, --require-hashes se install).

[project]
name = "bot"
version = "0.0.1"
description = "BankNifty/Nifty50/Sensex options bot (M0: neev). Idea: branch `idea`."
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src:."
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
