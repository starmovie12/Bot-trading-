# CI: har push/PR par. Koi secret use nahi hota, koi broker connection nahi.
# Actions exact commit SHA se pinned (10 Nov 2026 ko git ls-remote se dekhe).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dev tools (sirf hash-match wale)
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check (strict)
        run: mypy
      - name: Tests
        run: pytest
      - name: Niyam-file jaanch
        run: PYTHONPATH=src python -m bot.niyam config/niyam.toml
      - name: TLS jaanch band karne wala code nahi
        run: |
          if grep -rnE "CERT_NONE|verify\s*=\s*False|check_hostname\s*=\s*False|InsecureSkipVerify" src tools pehredaar; then
            echo "TLS-off code mila"; exit 1
          fi
      - name: Dependency audit
        run: pip-audit -r requirements-dev.lock --require-hashes --disable-pip

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pehredaar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet + test
        run: go vet ./... && go test ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
